<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eat. Different. — Coming soon</title>
  <meta name="description" content="Eat. Different. Comfort food. Different rules. Coming soon.">
  <style>
    :root { --bg: #0b0b0b; --gold: #f5b21a; --cream: #f3ead8; }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: var(--bg); color: var(--cream); text-align: center;
      font-family: "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    }
    .crown { color: var(--gold); font-size: 2rem; }
    h1 { font-size: clamp(3rem, 14vw, 7rem); font-style: italic; letter-spacing: 0.02em; }
    .tag { color: var(--gold); font-size: clamp(1.1rem, 4vw, 1.6rem); text-transform: uppercase; margin-top: 0.25rem; }
    .soon { margin-top: 2rem; letter-spacing: 0.3em; text-transform: uppercase; font-size: 0.9rem; opacity: 0.8; }
  </style>
</head>
<body>
  <main>
    <div class="crown" aria-hidden="true">♛</div>
    <h1>Eat. Different.</h1>
    <p class="tag">Comfort food. Different rules.</p>
    <p class="soon">Coming soon</p>
  </main>
</body>
</html>
